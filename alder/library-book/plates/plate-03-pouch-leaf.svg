<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Pouch binding places the fold at the fore edge</title>
  <desc id="desc">An enlarged head-edge view of one pouch leaf. A single paper sheet curls around on the right to put its fold at the fore edge. The two loose edges meet at the spine on the left. The printed surface faces outward above and below; the blank surface faces inward. A vertical line marks the sewing through the loose-edge margin. No opening of a historic leaf is being suggested.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9" fill="none" stroke="#6b4547" stroke-width="1.5"/></marker>
    <style>text{font-family:Georgia,'Times New Roman',serif;fill:#302923}.label{font-family:Arial,sans-serif;font-size:25px}.small{font-family:Arial,sans-serif;font-size:22px}.lead{stroke:#746655;stroke-width:2;fill:none}</style>
  </defs>
