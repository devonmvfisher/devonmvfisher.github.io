  <path d="M38 67H922M38 559H922" stroke="#b9a68c" stroke-width="2"/>
  <text x="38" y="45" font-size="27">II · THE CONNECTION TO THE BOARDS</text>
  <text x="50" y="114" class="label">Wooden board</text>
  <path d="M234 109L260 146" class="lead"/>
