<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">A sewn book block connected to its cover boards by continuous supports</title>
  <desc id="desc">Simplified spine view, with the book on its side and the covering removed. Four horizontal gathering folds lie between an upper and lower wooden board. Two thick vertical supports cross all the gathering folds and extend into channels in both boards. Fine crimson sewing connects each fold to the supports. The diagram maps structural connections rather than a complete stitch route.</desc>
  <defs><style>text{font-family:Georgia,'Times New Roman',serif;fill:#302923}.label{font-family:Arial,sans-serif;font-size:25px}.small{font-family:Arial,sans-serif;font-size:22px}.lead{stroke:#746655;stroke-width:2;fill:none}</style></defs>
