  <rect x="250" y="419" width="480" height="43" rx="3" fill="#c9a779" stroke="#6a5946" stroke-width="3"/>
  <path d="M276 156H706M270 172H698M275 434H706M290 449H710" stroke="#ac885d" stroke-width="2"/>
  <g fill="#fffaf0" stroke="#8e7d66" stroke-width="2">
    <rect x="270" y="213" width="440" height="32" rx="16"/>
    <rect x="270" y="256" width="440" height="32" rx="16"/>
    <rect x="270" y="299" width="440" height="32" rx="16"/>
    <rect x="270" y="342" width="440" height="32" rx="16"/>
