    <path d="M402 145L380 166V439L401 461"/>
    <path d="M602 145L580 166V439L601 461"/>
  </g>
  <g stroke="#6b4547" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M296 229H364Q380 205 396 229H564Q580 205 596 229H684"/>
    <path d="M296 272H364Q380 248 396 272H564Q580 248 596 272H684"/>
