<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">One sheet becomes two leaves; three nested sheets become a gathering</title>
  <desc id="desc">Left: a rectangular sheet folds along its middle. Centre: the folded sheet has two leaves and four page surfaces. Right: a head-edge diagram shows three nested folded sheets, coloured separately, producing six leaves and twelve pages. Their folds face the spine on the left and their free edges face right.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9" fill="none" stroke="#6b4547" stroke-width="1.5"/></marker>
    <style>text{font-family:Georgia,'Times New Roman',serif;fill:#302923}.label{font-family:Arial,sans-serif;font-size:25px}.small{font-family:Arial,sans-serif;font-size:22px}.lead{stroke:#746655;stroke-width:2;fill:none}</style>
  </defs>
  <rect width="960" height="600" fill="#f4eddd"/>
  <path d="M38 67H922M38 559H922" stroke="#b9a68c" stroke-width="2"/>
  <text x="38" y="45" font-size="27">I · THE FOLDED SHEET</text>
  <text x="50" y="117" class="label">One sheet</text>
  <path d="M50 170H268V355H50Z" fill="#fffaf0" stroke="#6a5946" stroke-width="3"/>
  <path d="M159 170V355" stroke="#6b4547" stroke-width="3" stroke-dasharray="9 7"/>
  <path d="M89 147Q159 99 233 146" stroke="#6b4547" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="50" y="400" class="label">Fold once at the centre</text>
  <path d="M159 361V374" class="lead"/>
  <text x="348" y="117" class="label">One bifolium</text>
  <path d="M430 186L348 154V343L430 375Z" fill="#eee0c6" stroke="#6a5946" stroke-width="3"/>
  <path d="M430 186L528 154V343L430 375Z" fill="#fffaf0" stroke="#6a5946" stroke-width="3"/>
  <path d="M430 186V375" stroke="#6b4547" stroke-width="4"/>
  <text x="349" y="416" class="label">2 leaves · 4 pages</text>
  <text x="637" y="117" class="label">One gathering</text>
  <text x="637" y="149" class="small">Three nested bifolia</text>
  <path d="M889 206H685Q628 206 628 273Q628 340 685 340H889" fill="none" stroke="#8e5651" stroke-width="6"/>
  <path d="M889 226H688Q648 226 648 273Q648 320 688 320H889" fill="none" stroke="#537768" stroke-width="6"/>
  <path d="M889 246H691Q668 246 668 273Q668 300 691 300H889" fill="none" stroke="#b5823f" stroke-width="6"/>
  <path d="M628 273H594V373" class="lead"/>
  <path d="M895 206H913V340H895" class="lead"/>
  <text x="565" y="402" class="small">Folds / spine</text>
  <text x="779" y="377" class="small">Free edges</text>
  <text x="635" y="447" class="label">6 leaves · 12 pages</text>
  <text x="50" y="513" class="small">A page is one surface. A leaf has two page surfaces.</text>
  <text x="50" y="546" class="small">Right-hand view looks down at the head edge; spacing is enlarged.</text>
</svg>
